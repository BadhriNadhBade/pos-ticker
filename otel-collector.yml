# OpenTelemetry Collector for the `observability` compose profile.
#
# pos-ticker does NOT push OTLP. This collector *scrapes* printer:8000/metrics
# with the prometheus receiver (authenticating with the admin key, injected from
# the ADMIN_KEY environment variable) and forwards the metrics to any backend.
#
# To enable a backend, uncomment its exporter block, add its credentials to .env
# (and to the otel-collector `environment:` in docker-compose.yml), then add the
# exporter to the pipeline at the bottom.
#
# Note: if you also run the bundled Prometheus, the printer is scraped twice
# (once by each). That is harmless; use whichever pipeline you prefer.

receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: printer
          scrape_interval: 15s
          metrics_path: /metrics
          authorization:
            type: Bearer
            credentials: ${env:ADMIN_KEY}
          static_configs:
            - targets: ['printer:8000']

processors:
  memory_limiter:
    limit_mib: 128
    check_interval: 5s
  batch:
    timeout: 5s

exporters:

  # ── Logging (always on; useful for debugging) ───────────────────────────────
  debug:
    verbosity: basic

  # ── Prometheus remote write (e.g. to a Prometheus on another host) ─────────
  # prometheusremotewrite:
  #   endpoint: http://100.x.y.z:9090/api/v1/write

  # ── Datadog ─────────────────────────────────────────────────────────────────
  # datadog:
  #   api:
  #     key: ${env:DD_API_KEY}
  #     site: datadoghq.com

  # ── Grafana Cloud (via OTLP/HTTP) ───────────────────────────────────────────
  # otlphttp:
  #   endpoint: https://otlp-gateway-prod-us-central-0.grafana.net/otlp
  #   headers:
  #     authorization: Basic ${env:GRAFANA_OTLP_TOKEN}

service:
  telemetry:
    metrics:
      # Collector self-metrics, scraped by the bundled Prometheus (otel-collector:8888).
      # (`address` form; valid for the pinned 0.116.x collector. Newer releases use
      # service.telemetry.metrics.readers -- adjust if you bump OTELCOL_VERSION.)
      level: basic
      address: 0.0.0.0:8888
  pipelines:
    metrics:
      receivers:  [prometheus]
      processors: [memory_limiter, batch]
      exporters:  [debug]
      # add prometheusremotewrite, datadog, otlphttp, ... here
